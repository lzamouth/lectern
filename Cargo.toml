[package]
name = "lectern"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "A native Markdown reader for GNOME"
publish = false

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
comrak = { version = "0.56", default-features = false }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
soup3 = "0.9"
sourceview5 = { version = "0.11", features = ["v5_10"] }

[build-dependencies]
glib-build-tools = "0.22"

[profile.release]
lto = true
codegen-units = 1
